name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/convex/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper exists and is executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew not found — generating wrapper..."
            cd android && gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x android/gradlew

      - name: Create placeholder google-services.json for CI
        run: |
          if [ ! -f android/app/google-services.json ]; then
            mkdir -p android/app
            cat > android/app/google-services.json << 'GSJSON'
{"project_info":{"project_number":"000000000000","project_id":"cadence-ci-placeholder","storage_bucket":"cadence-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"unifies.cadence"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD00000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000001","android_client_info":{"package_name":"unifies.cadence.debug"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD00000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
GSJSON
            echo "Created placeholder google-services.json for CI build"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## Android APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Debug APK:** \`cadence-debug-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release APK:** \`cadence-release-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
