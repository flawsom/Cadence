name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/convex/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper exists and is executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew not found — generating wrapper..."
            cd android && gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x android/gradlew

      - name: Create placeholder google-services.json for CI
        run: sh ./scripts/ci-placeholder-google-services.sh

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## Android APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Debug APK:** \`cadence-debug-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release APK:** \`cadence-release-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
