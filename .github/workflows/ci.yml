name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repo pages live under /<repo name>/ — keep in sync with the repo name.
  PAGES_BASE_PATH: /Cadence/
  # A Convex cloud URL is client-facing by design (every visitor's browser
  # talks to it directly), so a default here is safe. Override per-repo with
  # a repository VARIABLE named VITE_CONVEX_URL if you fork/self-host.
  DEFAULT_VITE_CONVEX_URL: https://blessed-mosquito-123.convex.cloud

jobs:
  # ── Typecheck + production build ────────────────────────────────────────────
  checks:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Convex generated types are committed to the repo (per convex codegen
      # docs), so typechecking needs no Convex deployment credentials.
      - name: Typecheck
        run: bunx tsc -b --noEmit

      # Ingestion quality gates: real university syllabus fixtures with
      # hard invariants (hour budgets, meta rejection, fundamentals-first).
      - name: Ingestion quality gates
        run: bun test scripts/ingest-quality.test.ts

      - name: Build for Pages (SPA fallback + subpath assets)
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || env.DEFAULT_VITE_CONVEX_URL }}
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
        run: |
          bun run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Local LLM: proves ingestion works with zero paid APIs ──────────────────
  local-llm:
    name: Local LLM (Ollama) smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null

      - name: Pull model (qwen3 1.7B — fits comfortably in 7GB runner)
        run: ollama pull qwen3:1.7b

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ingestion smoke test against the local model
        timeout-minutes: 10
        run: bun scripts/llm-smoke.ts
        env:
          LLM_MODEL: qwen3:1.7b

  # ── Android APK build ──────────────────────────────────────────────────────
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

  # ── GitHub Pages deploy — only after checks AND the LLM job pass ───────────
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
